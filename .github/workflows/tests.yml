name: Stable desktop tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-gui.txt
      - run: python scripts/test_desktop_only.py
      - run: python scripts/qa_library.py
